name: Build & Deploy (Compose via Coolify)

# Запуск при пуше в main
on:
  push:
    branches:
      - main

# Права для GitHub Actions
# contents:read — читать код
# packages:write — пушить Docker-образы в GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build image -> Push to GHCR -> Trigger Coolify
    runs-on: ubuntu-latest

    steps:
      # Вычисляем имя контейнера и сохраняем в переменные среды
      # PACKAGE_NAME — имя пакета в GHCR (должно быть lowercase)
      # IMAGE_NAME — полный путь к Docker образу
      - name: Set package/image names
        run: |
          pkg=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')
          echo "PACKAGE_NAME=$pkg" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/$pkg" >> $GITHUB_ENV

      # Получаем исходники репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Включаем Docker Buildx
      # (нужен для кэша и современных билдов Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Сборка Docker образа и публикация в GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Обновляем IMAGE_TAG в Coolify на текущий commit SHA
      - name: Set IMAGE_TAG in Coolify
        continue-on-error: true
        env:
          COOLIFY_API: ${{ secrets.COOLIFY_API }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP: ${{ secrets.COOLIFY_APP }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$COOLIFY_API/applications/$COOLIFY_APP/envs/bulk" \
            -d "{\"data\":[{\"key\":\"IMAGE_TAG\",\"value\":\"${{ github.sha }}\"}]}" \
          || echo "::warning::Coolify IMAGE_TAG update failed"

      # Триггер деплоя в Coolify через webhook
      - name: Trigger Coolify deploy
        continue-on-error: true
        env:
          COOLIFY_API: ${{ secrets.COOLIFY_API }}
          COOLIFY_APP: ${{ secrets.COOLIFY_APP }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Triggering Coolify deploy... ($COOLIFY_API/deploy?uuid=$COOLIFY_APP&force=true)"

          curl -sS -X POST \
            "$COOLIFY_API/deploy?uuid=$COOLIFY_APP&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
          || echo "::warning::Coolify deploy trigger failed"