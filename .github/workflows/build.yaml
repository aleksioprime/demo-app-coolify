name: Build & Deploy

# Сборка при пуше в main и вручную во вкладке Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read — читать код; packages: write — публиковать образ в GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build image -> Push to GHCR -> Trigger Coolify
    runs-on: ubuntu-latest

    steps:
      # Имя образа = ghcr.io/<владелец>/<репозиторий> строчными буквами
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Встроенный токен GitHub Actions: отдельный личный токен не нужен
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Деплой: Coolify скачивает свежий :latest. Токену достаточно права deploy.
      # Пока секреты Coolify не заданы (новый репозиторий из шаблона), шаг пропускается.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_API: ${{ secrets.COOLIFY_API }}
          COOLIFY_APP: ${{ secrets.COOLIFY_APP }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_API" ] || [ -z "$COOLIFY_APP" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Секреты COOLIFY_API, COOLIFY_APP, COOLIFY_TOKEN не заданы - деплой пропущен"
            exit 0
          fi
          curl -fsS -X POST "$COOLIFY_API/deploy?uuid=$COOLIFY_APP&force=false" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
