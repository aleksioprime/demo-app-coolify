name: Build & Deploy (Compose via Coolify)

# Запуск при пуше в main
on:
  push:
    branches:
      - main

# Права для GitHub Actions
# contents:read — читать код
# packages:write — пушить Docker-образы в GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build image -> Push to GHCR -> Trigger Coolify
    runs-on: ubuntu-latest

    steps:
      # Вычисляем имя контейнера и сохраняем в переменные среды
      # PACKAGE_NAME — имя пакета в GHCR (должно быть lowercase)
      # IMAGE_NAME — полный путь к Docker образу
      - name: Set package/image names
        run: |
          pkg=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')
          echo "PACKAGE_NAME=$pkg" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/$pkg" >> $GITHUB_ENV

      # Получаем исходники репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Включаем Docker Buildx
      # (нужен для кэша и современных билдов Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логин в GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Сборка Docker образа и публикация в GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сделать контейнер публичным (если он private)
      - name: Ensure GHCR package is public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "Checking package visibility..."

          visibility=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/${{ env.PACKAGE_NAME }} \
            | jq -r '.visibility')

          echo "Current visibility: $visibility"

          if [ "$visibility" = "private" ]; then
            echo "Making package public..."

            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user/packages/container/${{ env.PACKAGE_NAME }}/visibility \
              -d '{"visibility":"public"}'

            echo "Package is now public."
          else
            echo "Package already public. Skipping."
          fi

      # Триггер деплоя в Coolify через webhook
      - name: Trigger Coolify deploy
        continue-on-error: true
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Triggering Coolify deploy..."

          curl -sS -X POST "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
          || echo "::warning::Coolify deploy trigger failed"