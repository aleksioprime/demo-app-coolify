# Запуск на сервере из готового образа. Этот файл читает Coolify.
# Замените aleksioprime/demo-app-coolify на <ваш-логин>/<ваш-репозиторий> строчными буквами.
# Домен задаёт администратор в Coolify: https://<имя>.technocrew.ru:8000

services:
  app:
    image: ghcr.io/aleksioprime/demo-app-coolify:latest
    # Каждый деплой скачивает свежий :latest, собранный GitHub Actions
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
